[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-seal-cavitation-study"
version = "1.0.0"
authors = [
  { name="Abhishek Singh", email="abhishek1033@gmail.com" },
]
description = "Multi-physics simulation and fluid-seal synergistic mitigation of dynamic seal cavitation erosion."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "pandas>=1.4.0",
    "matplotlib>=3.5.0",
]

[project.urls]
"Homepage" = "https://github.com/Abhishek1033ubuntu/dynamic-seal-cavitation-study"
"Bug Tracker" = "https://github.com/Abhishek1033ubuntu/dynamic-seal-cavitation-study/issues"
